name: Build static site to repo root

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - '404.html'
      - 'ai-services/**'
      - 'support/**'
      - 'privacy/**'
      - 'accessibility/**'
      - 'it-maintenance/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "build-root"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_PROJECT_ID: pzjkrotlikvopslpdvof
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6amtyb3RsaWt2b3BzbHBkdm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE2NDkwMzIsImV4cCI6MjA3NzIyNTAzMn0.MUGLN3Xl6dhlR6LgCjP53AL0irvvRWs9MR8VWOfzQ78
          VITE_SUPABASE_URL: https://pzjkrotlikvopslpdvof.supabase.co

      - name: Copy build output to repo root
        run: |
          mkdir -p assets
          cp -r dist/assets/. ./assets/
          # SPA fallback so deep links (/privacy, /accessibility) work
          cp index.html 404.html
          # keep static files served from the root
          cp -f dist/robots.txt ./robots.txt 2>/dev/null || true
          cp -f dist/sitemap.xml ./sitemap.xml 2>/dev/null || true
          cp -f dist/llms.txt ./llms.txt
          # GitHub Pages מגיש מהשורש — בלי זה ה-favicon מחזיר 404
          cp -f dist/favicon.png ./favicon.png 2>/dev/null || true
          cp -f dist/favicon.ico ./favicon.ico 2>/dev/null || true
          cp -f dist/apple-touch-icon.png ./apple-touch-icon.png 2>/dev/null || true

      - name: Install Puppeteer browser and system dependencies
        continue-on-error: true
        run: npx puppeteer browsers install chrome --install-deps

      - name: Prerender public pages
        continue-on-error: true
        run: node scripts/prerender.mjs

      - name: Commit built assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets 404.html robots.txt sitemap.xml favicon.png favicon.ico apple-touch-icon.png
          git add llms.txt
          for directory in $(node --input-type=module -e "import { PRERENDER_ROUTES } from './scripts/prerender.mjs'; console.log(PRERENDER_ROUTES.map(route => route.slice(1)).join(' '))"); do
            if [ -d "$directory" ]; then
              git add -A "$directory"
            fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: build static assets [skip ci]"
            git push
          fi
